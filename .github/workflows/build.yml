name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.karachi.vip --project-name karachi_vip_hub --platforms=android
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          
          # minSdkVersion کو بڑھا کر 21 کرنا تاکہ فائر بیس کے پلگ انز بغیر کسی ایرر کے چل سکیں
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
